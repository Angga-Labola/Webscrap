<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Browser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            /* FIX 1: Allow the index page to grow naturally and scroll */
            min-height: 100vh;
            overflow-y: auto; 
        }
        form {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 300px;
            padding: 8px;
            font-size: 14px;
        }
        button {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        /* FIX 2: Remove strict heights from the container */
        #result-container {
            width: 100%;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: none; 
            margin-top: 20px;
        }
        /* FIX 3: Disable iframe internal scrollbars since the parent page will scroll */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden; 
        }
        .loading {
            color: #666;
            font-style: italic;
            display: none;
        }
    </style>
</head>

<body style="background-color: #000000; color: #73613c;">

<nav style="
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.3); 
    backdrop-filter: blur(10px); 
    padding: 1rem 5%;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3); 
    position: sticky;
    top: 0;
    z-index: 1000;">
        
        <ul style="
        list-style: none;
        display: flex;
        gap: 2rem;">
            <a href="https://github.io" style="text-decoration: none; color : #73613c; font-size: 1rem;">Home</a>
            <a href="https://github.io" style="text-decoration: none; color : #73613c; font-size: 1rem;">Creeds</a>
            <a href="https://github.io" style="text-decoration: none; color : #73613c; font-size: 1rem;">Articles</a>
            <a href="https://github.io" style="text-decoration: none; color : #73613c; font-size: 1rem;">Apps</a>
        </ul>
</nav>

    <h2>Incognito Browser</h2>
    <form id="form" action="/userinput" method="post">
        <textarea type="text" id="input" name="text" required
         style="width: 100%; max-width: 600px; height: 100px; box-sizing: border-box;" placeholder="Enter the URL here..."></textarea>
        <br><br>
        <button type="submit" style="display: inline-block; padding: 10px 20px; background-color: #3E5641; color : white; text-decoration: none; border-radius: 5px; text-align: center; border: none;">
            Submit
        </button>
    </form>

    <div id="loadingText" class="loading">Launching browser and loading page... Please wait.</div>

    <div id="result-container">
        <iframe id="renderFrame" scrolling="no"></iframe>
    </div>

<script>
    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        const urlInput = document.getElementById('input').value;
        const loadingText = document.getElementById('loadingText');
        const container = document.getElementById('result-container');
        const iframe = document.getElementById('renderFrame');

        loadingText.style.display = 'block';
        container.style.display = 'none';

        try {
            const response = await fetch('/userinput', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: urlInput
                })
            });

            if (!response.ok) throw new Error('Network response was not ok');

            const htmlContent = await response.text();

            const iframeDoc = iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(htmlContent);
            iframeDoc.close();

            container.style.display = 'block';

            // FIX 4: Dynamically calculate the full height of the scraped website content
            // and apply that exact pixel height directly to the iframe layout.
            iframe.onload = function() {
                setTimeout(() => {
                    const scrollHeight = iframe.contentWindow.document.documentElement.scrollHeight;
                    iframe.style.height = scrollHeight + 'px';
                    container.style.height = scrollHeight + 'px';
                }, 100); // Small delay ensures content completely populates first
            };
            
            // Trigger the height calculation immediately if iframe is already loaded
            const scrollHeight = iframeDoc.documentElement.scrollHeight;
            iframe.style.height = scrollHeight + 'px';
            container.style.height = scrollHeight + 'px';

        } catch (error) {
            alert('Error loading page: ' + error.message);
        } finally {
            loadingText.style.display = 'none';
        }
    });
</script>

</body>
</html>
